name: NetSniper CI

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq iproute2
      - name: Validate Bash syntax
        run: bash -n netsniper.sh
      - name: Run ShellCheck warnings and errors
        run: shellcheck -x --severity=warning netsniper.sh
      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            netsniper_core/*.py \
            tools/analyze_v2_1_gnmap.py \
            tools/classify_v2_1_host.py \
            tools/generate_v2_1_run_artifacts.py \
            tools/replay_v2_1_corpus.py \
            tools/validate_v2_1_corpus_activation.py \
            tools/validate_v2_1_evaluation_preparation.py \
            tools/validate_v2_1_evaluation_candidate_reseal.py \
            tools/validate_v2_1_observation_integrity.py \
            tools/validate_v2_1_embedded_admin_boundary.py \
            tools/validate_v2_1_stage1_2.py
      - name: Run v2.1 classifier, corpus, evaluation-preparation, candidate-reseal, observation-integrity, and embedded-admin gate
        run: ./tools/validate_v2_1_stage1_2_all.sh
